name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry.
#
# It has to run *after* the npm publish, never in parallel with it: the
# registry verifies ownership by fetching the npm package and matching its
# `mcpName` against the `name` in server.json, so racing the package's
# availability fails verification.
#
# The ordering comes from release.yml calling this workflow as a job
# (`workflow_call`). It cannot come from `on: release` for CI-created releases:
# release.yml creates the release with the default GITHUB_TOKEN, and GitHub
# does not start new workflow runs for events raised by that token, so that
# trigger fires only for releases made by hand in the UI — which is what it is
# kept for.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to advertise (e.g. v1.6.1); required when dispatching from a branch"
        required: false
        type: string
  workflow_call:

permissions:
  contents: read
  id-token: write # GitHub OIDC — the registry accepts the repo's own identity

env:
  # Pinned, like the actions. `latest` would let a new upstream release change
  # what this workflow runs without any commit here changing.
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # server.json is generated from package.json, so the version in it cannot
      # drift — but the *tag* can. Refuse to advertise a version that is not the
      # one being released. Dispatching from a branch (a repair after the tag
      # has shipped, say) has no tag of its own, so `inputs.tag` says which one
      # is meant.
      - name: server.json must match the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./server.json').version")"
          echo "server.json version: $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' does not match server.json version '$version'"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
