name: Release

# One tag push, no manual steps: validate the tag, prove the build, publish to
# npm with provenance, and attach the release notes from the CHANGELOG plus the
# .mcpb bundle.
#
# npm publishing uses OIDC trusted publishing: GitHub mints a short-lived token
# for this workflow and npm accepts it because the package's trusted publisher
# names `nutriandrea` / `adobe-indesign-mcp` / `release.yml`. There is no
# NPM_TOKEN and no long-lived credential to rotate or leak. The trusted publisher
# records this workflow's filename, so renaming this file breaks the release
# until npmjs.com is updated to match.
#
# The registry half lives in publish-mcp-registry.yml and is called below as a
# job, so it cannot start before this workflow has published to npm. It is not
# chained off `release: published`: release.yml creates the release with the
# default GITHUB_TOKEN, and GitHub does not start new workflow runs for events
# raised by that token — that chain never fired.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release and attach assets
  id-token: write # OIDC: npm trusted publishing, and provenance with it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a moving tag, for the same reason ci.yml is.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0 # validate-release-tag wants the tag; it is already checked out

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1, and Node 22 still ships npm
      # 10. Pinned for the same reason the actions are: a new upstream release
      # must not change what this workflow runs without a commit here changing.
      - name: Use an npm that can do OIDC
        run: npm install -g npm@11.17.0

      - run: npm ci

      # Tag and package.json must agree, and the version needs CHANGELOG notes.
      # Failing here is cheap; failing after the npm publish is not.
      - name: Validate the tag
        id: tag
        run: bash scripts/validate-release-tag.sh

      - name: Verify
        run: npm run verify

      - name: Verify the packed artifact
        run: npm run verify:pack

      # No NODE_AUTH_TOKEN anywhere: the OIDC exchange is the only credential, so
      # a trusted publisher that is missing or misconfigured fails loudly here
      # instead of publishing with a token that happened to still be lying
      # around. `setup-node` writes an .npmrc that references NODE_AUTH_TOKEN;
      # with the variable unset the npm CLI detects the OIDC environment first
      # and exchanges it for a short-lived publish token.
      #
      # `--provenance` is redundant under OIDC — npm generates and publishes the
      # attestation for a public package in a public repository on its own — and
      # is kept so the intent does not depend on that default staying put.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Build the .mcpb bundle
        run: npm run build:mcpb

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.tag.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            dist-mcpb/*.mcpb

  # Runs only after the release job has published to npm and created the GitHub
  # Release — exactly the ordering the registry's ownership check needs. Calling
  # it as a job rather than relying on `release: published` is what makes this
  # ordering real: events raised by the default GITHUB_TOKEN do not start new
  # workflow runs.
  registry:
    needs: release
    uses: ./.github/workflows/publish-mcp-registry.yml
